name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ] # Ganti 'main' dengan 'master' jika branch Anda bernama master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js v24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm' # Ganti ke 'pnpm' atau 'yarn' jika proyek Anda menggunakannya

      - name: Install dependencies
        run: npm ci # Gunakan 'npm install' jika 'npm ci' gagal

      - name: Build Astro Website
        run: npm run build

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Folder bawaan hasil build Astro

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
